# ============================================================================
# فحص مزامنة الدليل مع كود اللغة (drift detection).
# يقيس الانجراف تجاه **مرجع القفل نفسِه** (`sources.lock.json`.ref)، لأنّ البصمات أُخذت
# عنده، فقياسُها عند مرجعٍ سواه يقارن شيئًا بغيره. كان الافتراضُ «آخر وسم إصدار»،
# وv1.0.0 وسمُ 2026-03-09 سابقٌ لـ`language-truth/` و`scripts/codegen`، فكان التقريرُ يعلن
# حذفَ 30 مسارًا وتعذّرَ 47 (القضيّة #1)، وكلّها قائمةٌ سليمةٌ على dev — فصار الإنذارُ ضجيجًا
# لا يُقرأ. ولقياس الدليل تجاه إصدارٍ منشور: أعِد البصم عند وسمِه
# (`--ref vX --update --set-version X`)، ثمّ يصير هو مرجعَ القفل تلقائيًّا.
# يعمل: عند إصدار لغة جديد (repository_dispatch)، أسبوعيًّا، ويدويًّا.
# عند الانجراف يفتح/يحدّث قضيّة بالفصول المتأثّرة.
# ============================================================================
name: sync-check

on:
  schedule:
    - cron: "0 6 * * 1"      # كل اثنين 06:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "ref/وسم لقياس الانجراف تجاهه (افتراضيًّا مرجعُ القفل)"
        required: false
  repository_dispatch:
    types: [language-release]   # يطلقه مستودع اللغة عند نشر إصدار

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: تحديد الـref (وسم الإصدار > مُدخَل يدويّ > مرجع القفل > dev)
        id: ref
        run: |
          REF="${{ github.event.client_payload.tag }}"
          [ -z "$REF" ] && REF="${{ github.event.inputs.ref }}"
          # (AR) الافتراضيّ: المرجعُ الذي أُخذت عنده البصماتُ نفسُه — وحده
          #      يجعل «تغيّر/حُذف» تعفّنًا فعليًّا لا فرقَ مرجعين.
          if [ -z "$REF" ]; then
            REF=$(python -c "import json;print(json.load(open('sync/sources.lock.json',encoding='utf-8')).get('ref',''))" || true)
          fi
          [ -z "$REF" ] && REF="dev"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "نقيس الانجراف تجاه: $REF"

      - name: فحص الانجراف
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/check_sync.py --ref "${{ steps.ref.outputs.ref }}" --json > report.json
          echo "drift=$?" >> "$GITHUB_OUTPUT"
          cat report.json

      - name: صياغة جسم القضيّة
        if: steps.check.outputs.drift == '1'
        env:
          MEASURED_REF: ${{ steps.ref.outputs.ref }}
        run: |
          python - <<'PY' > body.md
          import json, os
          r = json.load(open("report.json", encoding="utf-8"))
          ref = os.environ["MEASURED_REF"]
          L = [f"رصد فحص المزامنة انجرافًا بين الدليل وكود اللغة عند **`{ref}`** "
               f"(النسخة المُغطّاة في الدليل: `{r.get('covers_version')}`).\n",
               "أي أن مصادر تغيّرت في اللغة وقد لا يطابقها الدليل بعد.\n"]
          lock_ref = r.get("lock_ref")
          if lock_ref and lock_ref != ref:
              L.append(f"> ⚠️ البصماتُ المخزّنة أُخذت عند `{lock_ref}` لا عند "
                       f"`{ref}`؛ فـ«حُذف» و«متعذّر الوصول» أدناه تعنيان «غير "
                       f"موجودٍ عند `{ref}`» لا «أُزيل من اللغة».\n")
          def sec(t, items):
              if items:
                  L.append(f"### {t}")
                  L.extend(f"- `{i}`" for i in items)
                  L.append("")
          sec("📝 مصادر تغيّرت", r["changed"])
          sec("➕ مصادر أُضيفت", r["added"])
          sec("➖ مصادر حُذفت/نُقلت", r["removed"])
          sec("❓ مصادر متعذّر الوصول", r["missing"])
          sec("📚 فصول تحتاج مراجعة", r["affected_chapters"])
          L.append("---")
          ver = ref.lstrip("v") if ref != "dev" else ""
          setver = f" --set-version {ver}" if ver else ""
          L.append("**بعد مراجعة الفصول وتعديلها فعليًّا**، ثبّت الحالة (وارفع النسخة "
                   "إن كان إصدارًا):")
          L.append(f"```\npython scripts/check_sync.py --ref {ref}{setver} --update\n```")
          L.append("> ملاحظة: حارس CI يرفض تثبيت القفل دون تعديل الفصل المرتبط فعليًّا.")
          L.append("\n<sub>أُنشئت آليًّا بوساطة workflow `sync-check`.</sub>")
          print("\n".join(L))
          PY

      - name: فتح/تحديث قضيّة الانجراف
        if: steps.check.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔄 انجراف الدليل عن كود اللغة"
          NUM=$(gh issue list --state open --search "$TITLE in:title" \
                --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file body.md
            gh issue comment "$NUM" --body "أُعيد رصد الانجراف في $(date -u +%F) تجاه \`${{ steps.ref.outputs.ref }}\`."
            echo "حُدِّثت القضيّة #$NUM"
          else
            gh issue create --title "$TITLE" --body-file body.md --label documentation 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: لا انجراف
        if: steps.check.outputs.drift == '0'
        run: echo "✅ الدليل متزامن مع ${{ steps.ref.outputs.ref }}."
