# ============================================================================
# فحص الجودة على كل Pull Request:
#   1) بناء mdBook (يلتقط أخطاء البناء/المخطّطات)
#   2) فحص روابط الإخراج المبنيّ بـ lychee (مستقلّ عن إصدار mdBook)
# لا ينشر — النشر في deploy.yml عند الدمج في main.
# ============================================================================
name: فحص الدليل (بناء + روابط)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      # (AR) نسخةٌ مثبَّتةٌ لا «latest»: قياساتُ الثيم (حاويةُ الجدول `.table-wrapper`،
      #      بنيةُ `print.html`، مُعرِّفاتُ العناوين العربيّة الخام) أُجريت على 0.5.4،
      #      وحرّاسُ `theme/page-toc.js` مبنيّةٌ عليها. ترقيةٌ صامتةٌ في «latest» تُبطلها
      #      بلا إنذار. الترقيةُ قرارٌ يُراجَع في PR لا حدثٌ يقع من تلقائه.
      - name: تثبيت mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: تثبيت mdbook-mermaid + أصوله
        run: |
          cargo install mdbook-mermaid --version 0.17.0 --locked
          mdbook-mermaid install .

      - name: البناء
        run: mdbook build

      - name: فحص الروابط الداخليّة (lychee على الإخراج المبنيّ)
        uses: lycheeverse/lychee-action@v2
        with:
          # (AR) --root-dir يحلّ روابط الجذر «/» المحلّيّة (يولّدها قالب 404.html في mdBook)
          #      إلى جذر الكتاب المبنيّ، وإلّا فشل lychee دون اتّصال («Cannot convert path '/'»).
          # (EN) --root-dir resolves local root links "/" (emitted by mdBook's 404.html) to the
          #      built book root; otherwise offline lychee errors with "Cannot convert path '/'".
          args: --offline --no-progress --root-dir "${{ github.workspace }}/book" "book/**/*.html"
          fail: true

  # حُرّاس نظام المزامنة: سلامة البيان + منع «الكتم الصامت» للقفل
  sync-guard:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع (بكامل التاريخ)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: (د) حارس سلامة البيان (بلا شبكة)
        run: python scripts/check_sync.py --validate

      # (AR) على `workflow_dispatch` يكون `base_ref` فارغًا ⇒ `origin/` ⇒ يفشل
      #      `git show` ⇒ قفلُ أساسٍ فارغ ⇒ يتخطّى الحارسُ نفسَه **صامتًا** ويُقرأ
      #      أخضرَ. الأخضرُ حينها يعني «لم يُقَس» لا «مرّ»؛ فنقصره على الـPR صراحةً.
      - name: (أ) حارس القفل — لا تثبيت بصمةٍ دون مراجعة فصلها
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          # (AR) فرّق بين «لا قفلَ في الأساس» (تخطٍّ مشروع) و«تعذّر بلوغُ الأساس»
          #      (حمرة). كان `|| :` يبتلع الحالتين معًا، فأيُّ فشلٍ لـ`git show` —
          #      مرجعٌ غيرُ مجلوب، نقلُ مسارِ القفل — يُنتج أساسًا فارغًا فيتخطّى
          #      الحارسُ نفسَه ويُرجع صفرًا: فاشلٌ مفتوحًا.
          git rev-parse --verify "$BASE" >/dev/null 2>&1 \
            || { echo "::error::مرجعُ الأساس $BASE غيرُ مجلوب — الحارسُ لم يُقَس."; exit 1; }
          if git cat-file -e "$BASE:sync/sources.lock.json" 2>/dev/null; then
            git show "$BASE:sync/sources.lock.json" > base.lock.json
          else
            : > base.lock.json   # لا قفلَ في الأساس فعلًا — تخطٍّ مشروع
          fi
          # (AR) بيانُ الأساس يلزم لقياس المفاتيح **المُسقَطة**: المفتاحُ المحذوف
          #      لا أثرَ له في البيان الحاليّ، فلا يُعرَف أيُّ فصلٍ كان يستشهد به.
          git show "$BASE:sync/sources.yaml" > base.sources.yaml 2>/dev/null || : > base.sources.yaml
          git diff --name-only "$BASE"...HEAD > changed.txt
          python scripts/check_sync.py --guard-lock --base base.lock.json \
                 --base-manifest base.sources.yaml --changed-files changed.txt
