# ============================================================================
# بيان المزامنة: يربط كل فصل في الدليل بمصادره في مستودع اللغة.
# يستخدمه scripts/check_sync.py لكشف انجراف الدليل عن الكود عند تطوّر اللغة.
# عند تغيّر أي مصدر (sha)، يُنبَّه إلى مراجعة الفصول المرتبطة به.
# ============================================================================
repo: sadlang/s-programming-language
ref: dev

# نسخة اللغة التي يغطّيها الدليل (تُرفَع آليًّا عند مراجعة إصدار: --update --set-version)
covers_version: "dev@1138f5e1"

# صيغة المصدر: إمّا مسار نصّيّ (يُرصد أيّ تغيّر في الملف/المجلد كاملًا)،
# أو كائن {path, lines: "بداية-نهاية"} لبصم نطاقٍ بعينه فقط — يقلّل الإنذارات
# الكاذبة في الملفّات الكبيرة ويرصد «تعفّن» المنطقة الموثَّقة تحديدًا.
chapters:
  - file: src/frontend/lexer.md
    sources:
      - { path: shared/lexer/src/lexer_core.cpp, lines: "100-1770" }  # peek→nextToken→الماسحات
      - shared/lexer/include/token.h
      - shared/lexer/src/lexer_keywords.cpp
      - language-truth/keywords.yaml

  - file: src/frontend/parser.md
    sources:
      - { path: shared/parser/src/core/parser_main.cpp, lines: "40-1600" }       # التهيئة→الموزّعات→tryParseDirective (L1588)
      - { path: shared/parser/src/core/parser_expressions.cpp, lines: "45-1160" } # سلسلة الأسبقيّة حتى parsePrimary (L1149)
      - shared/parser/include/parser_core.h
      - language-truth/operators.yaml

  - file: src/architecture/pipeline.md
    sources:
      - compiler/include/frontend/sir_types.h              # SIR: المرحلة 4ب
      - language-truth/cli_flags.yaml                      # --أظهر-llvm (نقاط التشخيص)

  - file: src/frontend/ast.md
    sources:
      - compiler/include/frontend/sir_builder.h            # SIRBuilder : SIRBuilderContext (ليس زائرًا) + buildModule
      - shared/ast/include/ast_visitor.h

  - file: src/frontend/comprehensions.md
    sources:
      - shared/parser/src/statements/parser_advanced.cpp   # parseArrayLiteral / parseMapLiteral (+ matchComma فكّ الزوج)
      - shared/ast/include/expressions.h                   # List/Set/DictComprehensionExpr (+ valueVariable)
      - interpreter/src/visitors/expression_evaluator_members_advanced.cpp  # زائرات الاستيعاب + فرع الخريطة
      - compiler/src/frontend/builders/expression_comprehensions.cpp  # بانِي القائمة/القاموس + lowerMapComprehensionIterable
      - compiler/src/frontend/builders/expression_comp2.cpp           # بانِي المجموعة (مسح إزالة التكرار)
      - compiler/src/frontend/builders/statement_for_range.cpp        # أساس تكرار الخريطة في المترجم
      - compiler/include/frontend/sir_constants.h                     # kRuntimeMapKeys/kRuntimeMapValues (عقد الأسماء المشترك)
      - compiler/src/backend/llvm/builders/collections/map_ops.cpp    # __sad_map_keys/values + getOrCreateMapCollect
      - compiler/src/frontend/builders/builtins_core.cpp              # تمرير elementType لمُعامل الطبع
      - compiler/src/backend/llvm/builders/builtins/io_builtins_ops.cpp  # طبع المصفوفة الموسوم (__sad_array_to_string_str)
      - language-truth/grammar

  - file: src/backend/interpreter.md
    sources:
      - interpreter/src/core/interpreter_core.cpp          # execute(): الطور الساكن (قاعدة الرئيسية · فحص الأنواع · أمان العدم)
      - shared/types/include/class_manager.h               # المُفرَد العابر للمحرّكين (خارج مدراء المفسّر)
      - shared/types/src/class_manager.cpp                 # القفل على getInstance/resetInstance وحدهما
      - interpreter/include/channel.h                      # GoroutineManager + SadChannel
      - interpreter/include/core/interpreter_core.h
      - interpreter/include/visitors/expression_evaluator.h
      - shared/ast/include/ast_visitor.h

  - file: src/backend/sir.md
    sources:
      - compiler/include/frontend/sir_types.h

  - file: src/backend/llvm.md
    sources:
      - language-truth/cli_flags.yaml                      # --أظهر-llvm / --أظهر-bc: اسم عربيّ وحيد بلا مرادفات
      - tools/compiler/compiler_driver_backend_llvm_absent.cpp  # هدف sad-build-native: رفض صريح INT_LLVM_PATH_ABSENT
      - compiler/src/backend/llvm

  - file: src/backend/native.md
    sources:
      - { path: compiler/include/backend/native/sir_native_lowering.h, lines: "1-30" }  # عقد الجسر (الترويسة)
      - compiler/include/backend/native/sir_lowering_common.h   # LoweringDriver<Target> + LoweringDiagnostics
      - compiler/include/backend/native/elf64_writer.h
      - compiler/include/backend/native/x86_variable_encoder.h
      - tools/compiler/compiler_driver_native.cpp               # المدخل من --خلفية-أصلية
      - language-truth/backend                                  # targets · sir_opcodes · isel · abi · diagnostics · value_repr
      - scripts/codegen/gen_native_diagnostics.py
      - scripts/native_backend/run_native_proofs.sh             # المُنادي وحرّاسه الأربعة

  - file: src/systems/memory.md
    sources:
      - shared/memory_policy/include/memory/policy/gc_mode.h
      - shared/memory_policy/include/memory/policy/memory_mode_flag.h
      - shared/memory_policy/src/memory_mode_flag.cpp
      - language-truth/cli_flags.yaml   # عائلة memory: الأسماء القانونيّة العشرة (مصدر جدول الأعلام)

  - file: src/systems/types.md
    sources:
      - shared/types/include/sad_type_system.h
      - shared/types/generated/sad_type_kind_generated.h
      - shared/types/include/value.h
      - language-truth/types.yaml

  - file: src/systems/errors.md
    sources:
      - shared/errors/include/error_codes.h
      - shared/errors/include/error_manager.h
      - scripts/codegen/gen_error_messages.py
      - language-truth/errors

  - file: src/systems/builtins.md
    sources:
      - language-truth/builtins
      - interpreter/src/builtins

  - file: src/systems/sadui-layout.md
    sources:
      - features/graphics/core/src/layout.cpp
      - features/graphics/core/include/sad_ui/prop_keys.h
      - language-truth/ui_props.yaml
      - scripts/codegen/gen_ui_props.py

  - file: src/backend/crypto-unification.md
    sources:
      - { path: shared/lexer/src/lexer_core.cpp, lines: "100-1770" }  # تخطّي التشكيل U+064B–U+065F ⇒ «شفّر» تعمل و«شفر» هو القانونيّ
      - compiler/src/frontend/builders/builtins_security.cpp
      - compiler/src/backend/llvm/builders/builtins/security_builtins_ops.cpp
      - interpreter/src/builtins/builtin_module_assertions.cpp
      - language-truth/builtins/assertions.yaml

  - file: src/backend/crypto-library-expansion.md
    sources:
      - interpreter/src/builtins/builtin_module_crypto.cpp
      - tools/compiler/runtime/sad_embedded_runtime.c
      - tools/compiler/compiler_driver_android_linker.cpp
      - language-truth/builtins/crypto.yaml

  - file: src/sot/philosophy.md
    sources:
      - language-truth/_schemas
      - scripts/codegen

  - file: src/sot/language-truth.md
    sources:
      - language-truth
      - language-truth/_schemas

  - file: src/sot/codegen.md
    sources:
      - scripts/codegen

  - file: src/sot/grammar-sot.md
    sources:
      - scripts/codegen/gen_grammar_lowers_to.py           # مولِّد lowers_to.yaml (اشتقاق تجريبيّ بـ--أظهر-sir)
      - language-truth/grammar
      - scripts/codegen/gen_parser_grammar_docs.py

  - file: src/contributing/workflow.md
    sources:
      - .github/BRANCH_PROTECTION_POLICY.md

  - file: src/contributing/governance.md
    sources:
      - .github/skills/sad-lang-dev/references/governance.md

  # الموجة الثالثة: فصولٌ كانت خارج الحارس، ودعاواها أوامرُ يُشغّلها القارئ.
  # (AR) نطاقُ `tests/config.yaml` مشطورٌ بحسب الدعوى: 25-26 مسارا الثنائيَّين،
  #      و27 `tests_dir` وحده. الجمعُ في نطاقٍ واحد (24-27) كان يقرن **خمسةَ** فصول
  #      بمفتاحٍ واحد، فيلزم حارسُ القفل تعديلَ فصلٍ لا علاقةَ لدعواه بما تغيّر.
  - file: src/getting-started/setup.md
    sources:
      - { path: CMakeLists.txt, lines: "29-70" }        # cmake_minimum_required(3.15) + BUILD_TESTS OFF + ENABLE_LLVM_BACKEND ON
      - { path: tests/config.yaml, lines: "25-26" }     # مسارا الثنائيَّين من build/bin/Debug
      - { path: x.py, lines: "1310-1350" }              # الأوامر الفرعيّة للبوّابة الموحّدة
      - { path: ".", names: true }                      # دعوى «لا runner.py في الجذر»
      - { path: tests, names: true }                    # دعوى «tests/runner.py هو المستدعى»
      - { path: examples, names: true }                 # دعوى «examples\01_مرحبا.ص»
      - { path: apps/CMakeLists.txt, lines: "292-310" } # sad-build داخل شرط LLVM + البديل sad-build-native
      - { path: tests/config.yaml, lines: "15-23" }     # تعليقُ «Debug+Release» وعلاجُه في cmake/llvm.cmake

  - file: src/getting-started/first-contribution.md
    sources:
      - { path: tests, names: true }                    # `python tests/runner.py` — لا runner.py في الجذر
      - { path: tests/config.yaml, lines: "27" }        # دعوى «الاختبار تحت tests/behavior»
      - { path: x.py, lines: "1310-1350" }              # `python x.py build`

  - file: src/getting-started/repo-map.md
    sources:
      - language-truth/keywords.yaml                    # ٤٠ محجوزة · ٣ · ٤٤ · ١٧
      - { path: tests/config.yaml, lines: "27" }        # tests_dir: tests/behavior
      - { path: ".", names: true }                      # شجرة الجذر كما تُرسم في الفصل
      - { path: tools, names: true }
      - { path: stdlib, names: true }
      - { path: tests, names: true }                    # لا tests/comprehensive
      - { path: tests/behavior, names: true }           # حِزَم `.ص` الستّ
      - { path: examples, names: true }                 # 01_مرحبا … 07_مكوّن_مركّب
      - { path: x.py, lines: "1310-1350" }              # الفصل يسمّي الأوامر الفرعيّة في شجرته

  - file: src/contributing/definition-of-done.md
    sources:
      - { path: tests/config.yaml, lines: "25-26" }     # الثنائيّان من تهيئةٍ واحدة
      - { path: tests, names: true }                    # `python tests/runner.py`

  # ── الحلّ الجذريّ: دعاوى «شكل الشجرة» تُبصَم بأسماء المدخلات (names) لا بمحتواها،
  #    وفصولُ الدليل التي توثّق أدواتِه تُبصَم من هذا المستودع نفسِه (self:).
  - file: src/architecture/overview.md
    sources:
      - { path: ".", names: true }        # جذر الشجرة — يرصد عودة vm/ أو ظهور جزءٍ جديد
      - { path: tools, names: true }      # «١٥ مجلّدًا» بأسمائها
      - { path: stdlib, names: true }     # وحدات `.ص` + مجلّدات الدعم
      - { path: features, names: true }   # features/graphics — الرسومات ليست في stdlib

  - file: src/architecture/interconnected.md
    sources:
      - { path: scripts/codegen, names: true }
      - { path: interpreter/src/visitors, names: true }
      - { path: compiler/src/backend/llvm/builders/builtins, names: true }
      - { path: docs/parser_rule/_generated, names: true }
      - { path: shared/builtins/generated, names: true } # دعوى مسار builtin_registry_generated.h

  - file: src/contributing/freshness.md
    sources:
      - self:scripts/check_sync.py                  # الفصل يصف هذه الأداة بعينها
      - self:.github/workflows/sync-check.yml       # ومسارَ الفحص الأسبوعيّ
      - self:.github/workflows/ci.yml               # والفصلُ يصف حارسَي ci.yml بعينهما

  - file: src/glossary.md
    sources:
      - { path: tests/config.yaml, lines: "25-26" } # sad-run · sad-build · sadc المتقاعد
      - { path: tests/config.yaml, lines: "27" }    # دعوى `tests_dir`
